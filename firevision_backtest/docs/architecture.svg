<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:Arial;fill:#dceaf0}.box{fill:#0b1a21;stroke:#3c6975;stroke-width:2}.arrow{stroke:#6fa9b6;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6fa9b6"/></marker></defs><rect width="1200" height="650" fill="#071016"/><text x="50" y="55" font-size="30" font-weight="bold">FIRE-Vision Architecture</text><rect class="box" x="50" y="100" width="250" height="90" rx="12"/><text x="175" y="140" text-anchor="middle" font-size="18">React / Vite</text><text x="175" y="168" text-anchor="middle" font-size="13">Forensic Workstation UI</text><rect class="box" x="475" y="100" width="250" height="90" rx="12"/><text x="600" y="140" text-anchor="middle" font-size="18">FastAPI</text><text x="600" y="168" text-anchor="middle" font-size="13">REST + validation + orchestration</text><rect class="box" x="900" y="100" width="250" height="90" rx="12"/><text x="1025" y="140" text-anchor="middle" font-size="18">SQLite / SQLAlchemy</text><text x="1025" y="168" text-anchor="middle" font-size="13">Case + evidence + provenance</text><path class="arrow" d="M300 145 H470"/><path class="arrow" d="M725 145 H895"/><rect class="box" x="90" y="285" width="300" height="95" rx="12"/><text x="240" y="325" text-anchor="middle" font-size="17">Evidence Acquisition</text><text x="240" y="352" text-anchor="middle" font-size="13">copy → MD5 → SHA-256 → verify</text><rect class="box" x="450" y="285" width="300" height="95" rx="12"/><text x="600" y="325" text-anchor="middle" font-size="17">Analysis Pipeline</text><text x="600" y="352" text-anchor="middle" font-size="13">identify → FFprobe → carve → timeline → AI</text><rect class="box" x="810" y="285" width="300" height="95" rx="12"/><text x="960" y="325" text-anchor="middle" font-size="17">Provenance</text><text x="960" y="352" text-anchor="middle" font-size="13">graph → passport → replay → report</text><path class="arrow" d="M600 190 V280"/><path class="arrow" d="M390 332 H445"/><path class="arrow" d="M755 332 H805"/><rect class="box" x="300" y="475" width="600" height="95" rx="12"/><text x="600" y="515" text-anchor="middle" font-size="18">Controlled Evidence Store</text><text x="600" y="542" text-anchor="middle" font-size="13">Original evidence is never modified by analysis operations</text><path class="arrow" d="M240 380 V455 H300"/><path class="arrow" d="M600 380 V470"/><path class="arrow" d="M960 380 V455 H900"/></svg>